<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Задача команде</title>
  <link rel="stylesheet" href="./index.css?v=8" />
  <script src="https://files.kaiten.ru/web-sdk/v1.min.js"></script>
</head>
<body>
  <form id="f" class="form modal-page">
    <p class="hint" id="lead">Задача появится на доске команды и сразу привяжется к этому проекту.</p>
    <label>Что нужно сделать *
      <input id="title" required placeholder="Например: Лендинг под рост CR2" />
    </label>
    <label>Команда *
      <select id="board" required></select>
    </label>
    <div id="team-load" class="hint" style="min-height:16px;margin:-4px 0 4px"></div>
    <label>Кому <span class="hint">— необязательно, команда сама распределит</span>
      <select id="responsible"><option value="">— не назначен —</option></select>
    </label>
    <label>Срок <span class="hint" id="due-hint"></span>
      <input id="due" type="date" />
    </label>
    <!-- Аппетит вместо оценки в часах.
         Оценка — это прогноз, и он всегда врёт: поле было обязательным с
         подставленной «4», её просто прожимали, и в отчёты шли выдуманные часы
         (заполнено честно было 2 задачи из 22). Аппетит — не прогноз, а
         решение: сколько мы готовы на это потратить. На такой вопрос можно
         ответить сразу и не соврать. -->
    <label>Сколько готовы вложить <span class="hint">не обязательно</span>
      <select id="appetite">
        <option value="">— не решили —</option>
        <option value="S · до 2 дней">S · до 2 дней</option>
        <option value="M · до недели">M · до недели</option>
        <option value="L · до 2 недель">L · до 2 недель</option>
        <option value="XL · надо дробить">XL · надо дробить</option>
      </select>
    </label>
    <div class="row">
      <button type="submit" id="go">Создать задачу</button>
    </div>
    <div id="msg" class="hint"></div>
  </form>
  <script src="../js/new-task.js?v=8"></script>
</body>
</html>
