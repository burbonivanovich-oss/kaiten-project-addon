<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Новый проект</title>
  <link rel="stylesheet" href="./index.css?v=10" />
  <script src="https://files.kaiten.ru/web-sdk/v1.min.js"></script>
</head>
<body>
  <form id="f" class="form modal-page">
    <label>Название проекта *
      <input id="title" required placeholder="Например: Партнёрство с …" />
    </label>
    <!-- Срок обязателен: это ставка, а не украшение. Проект без срока нельзя
         сравнить с темпом, поэтому система не может сказать про него ничего,
         кроме процента. Так «Квиз» и провисел без единого сигнала. -->
    <label>До какого числа готовы этим заниматься *
      <input id="due" type="date" required />
      <span class="hint">Не прогноз, а решение: сколько мы готовы вложить.
      Если к сроку не успели — это повод пересмотреть замысел, а не молча продлить.</span>
    </label>
    <label>Ответственный
      <select id="responsible"><option value="">— не назначен —</option></select>
    </label>
    <div class="row">
      <button type="submit" id="go">Создать проект</button>
    </div>
    <div id="msg" class="hint"></div>
  </form>
  <script src="../js/new-project.js?v=24"></script>
</body>
</html>
