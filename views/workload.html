<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Загруженность команды</title>
  <script src="https://files.kaiten.ru/web-sdk/v1.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f6f8;
      --surface:  #ffffff;
      --border:   #e4e6ea;
      --text:     #1a1d23;
      --muted:    #6b7280;
      --accent:   #3b5bdb;
      --bar-bg:   #e8ecf8;
      --bar-fill: #3b5bdb;
      --done:     #12b76a;
      --wip:      #f59e0b;
      --backlog:  #94a3b8;
      --radius:   10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0f1117;
        --surface: #1a1d26;
        --border:  #2a2d38;
        --text:    #e8eaf0;
        --muted:   #8b92a5;
        --bar-bg:  #252a3a;
        --bar-fill:#6681ff;
      }
    }
    :root[data-theme="light"] {
      --bg:#f5f6f8;--surface:#fff;--border:#e4e6ea;--text:#1a1d23;
      --muted:#6b7280;--bar-bg:#e8ecf8;--bar-fill:#3b5bdb;
    }
    :root[data-theme="dark"] {
      --bg:#0f1117;--surface:#1a1d26;--border:#2a2d38;--text:#e8eaf0;
      --muted:#8b92a5;--bar-bg:#252a3a;--bar-fill:#6681ff;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

    .shell { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    header h1 { font-size: 18px; font-weight: 700; flex: 1; }
    .updated { font-size: 12px; color: var(--muted); }

    .tabs { display: flex; gap: 4px; background: var(--border); border-radius: 8px; padding: 3px; }
    .tab { border: none; background: none; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 500; transition: all .15s; }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    .panel { display: none; }
    .panel.active { display: block; }

    .row-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    .row-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
                padding: 12px 16px; cursor: pointer; user-select: none; }
    .row-head:hover { background: var(--bar-bg); }
    .row-name { font-weight: 600; font-size: 14px; flex: 1 1 180px; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-wrap { position: relative; height: 8px; background: var(--bar-bg); border-radius: 4px;
                overflow: hidden; flex: 1 1 100%; order: 3; }
    .bar-fill { height: 100%; background: var(--bar-fill); border-radius: 4px; transition: width .4s ease; }
    .row-meta { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--muted); }
    .row-meta strong { color: var(--text); }

    .task-list { border-top: 1px solid var(--border); display: none; }
    .task-list.open { display: block; }
    .task-item { display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    .task-item:last-child { border-bottom: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-backlog { background: var(--backlog); }
    .dot-wip     { background: var(--wip); }
    .dot-review  { background: #8b5cf6; }
    .dot-done    { background: var(--done); }
    .task-title  { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-proj   { font-size: 12px; color: var(--muted); white-space: nowrap; padding: 2px 7px; background: var(--bar-bg); border-radius: 4px; }
    .link        { cursor: pointer; }
    .link:hover  { text-decoration: underline; color: var(--accent); }
    .norm-label  { font-size: 12px; font-weight: 700; }
    .norm-label.muted { color: var(--muted); font-weight: 400; }
    .task-hours  { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; min-width: 36px; text-align: right; }

    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px; }
    .spinner { text-align: center; padding: 60px; color: var(--muted); font-size: 13px; }

    .gate { max-width: 400px; margin: 80px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; }
    .gate-icon { font-size: 40px; margin-bottom: 12px; }
    .gate-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .gate-text { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .gate-msg { color: var(--muted); font-size: 12px; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { opacity: .9; }

    .total-row { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; }
    .stat-val { font-size: 24px; font-weight: 700; }
    .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Загруженность команды</h1>
      <div class="tabs">
        <button class="tab active" data-tab="people">По людям</button>
        <button class="tab" data-tab="projects">По проектам</button>
      </div>
      <span class="updated" id="updated"></span>
    </header>

    <div class="total-row" id="totals"></div>

    <div class="panel active" id="panel-people">
      <div class="spinner">Загружаю данные…</div>
    </div>
    <div class="panel" id="panel-projects"></div>
  </div>

  <script src="../js/workload.js?v=4"></script>
</body>
</html>
